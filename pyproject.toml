[project]
name = "kasoma"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.41,<1",
  "pydantic-settings>=2.13,<3",
  "python-dotenv>=1.2.3,<2",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.3,<4",
  "redis>=7,<8",
  "celery[redis]>=5.6,<5.7",
  "httpx>=0.28,<1",
  "opentelemetry-sdk>=1.39,<2",
  "minio>=7.2,<8",
  "urllib3>=2.8,<3",
  "cryptography>=50,<51",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-socket>=0.7,<1", "hypothesis>=6,<7",
  "ruff>=0.15,<1", "mypy>=1.19,<2", "pip-audit>=2.10,<3", "bandit>=1.9,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket"
markers = ["integration: requires local PostgreSQL and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["apps/**/*.py", "services/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["apps", "services", "scripts/recovery_drill.py", "scripts/recovery_containers.py", "scripts/object_recovery_drill.py", "scripts/disposable_owner.py", "scripts/recovery_fixture.py", "scripts/objective_load.py", "scripts/temporal_history.py", "scripts/ci_runner_storage.py", "scripts/e2e_failures.py", "scripts/browser_database.py", "scripts/erasure_identity_check.py", "scripts/migration_diagnostics.py", "scripts/erasure_scope.py", "scripts/erasure_capability.py", "scripts/erasure_plan_sql.py", "scripts/erasure_acl_sql.py", "scripts/erasure_catalog_code.py", "scripts/erasure_installed_queries.py", "scripts/erasure_installed_profile.py", "scripts/erasure_catalog_baseline.py", "scripts/erasure_catalog_portability.py"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
