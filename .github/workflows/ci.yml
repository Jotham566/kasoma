name: Foundation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ALLOW_EXTERNAL_API_CALLS: "false"
      MODEL_PROVIDER: fake
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yaml
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable runner storage
        env:
          KASOMA_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: sudo --preserve-env=CI,GITHUB_ACTIONS,KASOMA_CI_RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH,GITHUB_WORKSPACE,RUNNER_TEMP make ci-runner-storage
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: npm install --global corepack@0.34.0
      - run: make setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/browsers
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: make check-ci-profile
      - name: Configure public image cache on disposable CI runner
        env:
          CI_DOCKER_CONFIG: ${{ runner.temp }}/kasoma-docker-daemon.json
        run: |
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json > "$CI_DOCKER_CONFIG"
          else
            echo '{}' > "$CI_DOCKER_CONFIG"
          fi
          make ci-docker-config
          sudo dockerd --validate --config-file "$CI_DOCKER_CONFIG"
          sudo install -m 0644 "$CI_DOCKER_CONFIG" /etc/docker/daemon.json
          sudo timeout 60s systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - name: Check optional registry credential availability
        id: registry-credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate public image pulls when credentials are available
        if: steps.registry-credentials.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true
      - run: make build e2e-install test-web-content
      - name: Verify native WebKit attachment transport
        env:
          KASOMA_E2E_BROWSER: webkit
        run: make test-export-download-control
      - name: Verify bounded synthetic commit interception
        run: make test-commit-interception
      - run: make services migrate seed
      - name: Verify stable review actions and resumed practice
        run: make test-web-assessment
      - run: make test-reviewed-rubrics
      - run: make recovery-drill
      - run: make test-runtime-role
      - run: make lint test openapi-check build
      - run: make e2e-install
      - run: make ci-storage-check e2e
      - run: make ci-storage-check security containers
      - run: make security-source security-containers container-smoke
      - name: Final read-only storage diagnostics
        if: always()
        run: |
          make ci-storage-report
          docker system df
