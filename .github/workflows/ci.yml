name: Foundation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ALLOW_EXTERNAL_API_CALLS: "false"
      MODEL_PROVIDER: fake
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: npm install --global corepack@0.34.0
      - run: make setup
      - run: make services migrate seed
      - run: make recovery-drill
      - run: make test-runtime-role
      - run: make lint test openapi-check build
      - run: make e2e-install
      - run: make e2e security containers
      - run: make security-source security-containers container-smoke
